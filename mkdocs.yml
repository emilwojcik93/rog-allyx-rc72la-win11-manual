site_name: Ally X Lean Win11
site_description: Minimal Windows 11 USB install for ASUS ROG Ally X (RC72LA)
site_url: https://emilwojcik93.github.io/rog-allyx-rc72la-win11-manual/
repo_url: https://github.com/emilwojcik93/rog-allyx-rc72la-win11-manual
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

markdown_extensions:
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Prerequisites: 00-prerequisites.md
  - Windows ISO: 01-download-windows11.md
  - MicroWin: 02-build-microwin.md
  - Drivers: 03-drivers-asus.md
  - DISM: 04-dism-offline-drivers.md
  - USB deploy: 05-usb-deploy.md
  - After install: 06-post-install.md
  - Fingerprint: troubleshooting-fingerprint.md
  - Driver store (RAPR): troubleshooting-driver-store-rapr.md
  - WinUtil package list: winget-profile.md
  - References: references.md

plugins:
  - search
